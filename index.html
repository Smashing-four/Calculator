        outputMaxLevelAchievedText: '0'
    },
    'zh': {
        pageTitle: 'Smashing Four 卡牌计算器 | S4 部落 SK&CZE',
        metaDescription: '带部落捐赠卡牌余量支持的计算器。',
        metaKeywords: 'Smashing Four',
        calculatorTitle: '卡牌计算器',
        heroTypeLabel: '英雄类型:',
        commonOption: '普通',
        rareOption: '稀有',
        epicOption: '史诗',
        currentLevelLabel: '英雄等级:',
        currentLevelPlaceholder: '输入等级',
        cardsLabel: '卡牌数量:',
        cardsPlaceholder: '输入卡牌',
        calculateButton: '计算',
        outputMaxLevelReached: '已达最高等级！',
        outputMaxLevel: '最高可能等级:',
        outputRemainingCards: '剩余卡牌:',
        outputCardsToNextLvl: '下一级所需卡牌:',
        outputCardsToLvl27: '达到27级所需卡牌:',
        outputGoldToLevel: '达到该等级所需金币',
        outputGoldToMax: '达到27级所需金币:',
        errorInvalidLevel: '无效等级！',
        errorCommonLevelRange: '必须在1到27之间！',
        errorRareLevelStart: '从3级开始！',
        errorEpicLevelStart: '从5级开始！',
        errorInvalidCards: '无效卡牌数量！',
        errorMaxCards: '不能超过 {maxCards}！',
        errorCardsExceedMaxPossible: '包含捐赠余量的最大卡牌数为 {maxCards}。',
        outputMaxLevelAchievedText: '0'
    }
};

let currentLang = 'sk';

function formatGold(number) {
  return Number(number).toLocaleString('sk-SK').replace(/\u00A0/g, ' ');
}

function setLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];
    const outputDiv = document.getElementById('output');
    const head = document.head;

    document.getElementById('pageTitle').textContent = t.pageTitle;

    let metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) {
        metaDescription.setAttribute('content', t.metaDescription);
    } else {
        metaDescription = document.createElement('meta');
        metaDescription.name = 'description';
        metaDescription.content = t.metaDescription;
        head.appendChild(metaDescription);
    }

    let metaKeywords = document.querySelector('meta[name="keywords"]');
    if (metaKeywords) {
        metaKeywords.setAttribute('content', t.metaKeywords);
    } else {
        metaKeywords = document.createElement('meta');
        metaKeywords.name = 'keywords';
        metaKeywords.content = t.metaKeywords;
        head.appendChild(metaKeywords);
    }

    switch (lang) {
        case 'sk':
        case 'cs':
        case 'nl':
            outputDiv.style.fontSize = '14px';
            document.body.style.fontFamily = "'Russo One', sans-serif";
            break;
        case 'de':
            outputDiv.style.fontSize = '13px';
            document.body.style.fontFamily = "'Russo One', sans-serif";
            break;
        case 'pl':
            outputDiv.style.fontSize = '12px';
            document.body.style.fontFamily = "'Russo One', sans-serif";
            break;
        case 'es':
        case 'pt':
            outputDiv.style.fontSize = '12px';
            document.body.style.fontFamily = "'Russo One', sans-serif";
            break;
        case 'ru':
            outputDiv.style.fontSize = '11px';
            document.body.style.fontFamily = "'Russo One', sans-serif";
            break;
        case 'zh':
            outputDiv.style.fontSize = '12px';
            document.body.style.fontFamily = '"Microsoft YaHei", "SimSun", sans-serif';
            break;
        case 'en':
        default:
            outputDiv.style.fontSize = '14px';
            document.body.style.fontFamily = "'Russo One', sans-serif";
            break;
    }

    document.getElementById('calculatorTitle').textContent = t.calculatorTitle;
    document.getElementById('heroTypeLabel').textContent = t.heroTypeLabel;
    document.getElementById('commonOption').textContent = t.commonOption;
    document.getElementById('rareOption').textContent = t.rareOption;
    document.getElementById('epicOption').textContent = t.epicOption;
    document.getElementById('currentLevelLabel').textContent = t.currentLevelLabel;
    document.getElementById('currentLevel').placeholder = t.currentLevelPlaceholder;
    document.getElementById('cardsLabel').textContent = t.cardsLabel;
    document.getElementById('cards').placeholder = t.cardsPlaceholder;
    document.getElementById('calculateButton').textContent = t.calculateButton;

    outputDiv.innerHTML = '';
}

function calculate() {
  const heroType = document.getElementById('heroType').value;
  const currentLevelInput = document.getElementById('currentLevel');
  const cardsInput = document.getElementById('cards');
  const currentLevel = parseInt(currentLevelInput.value, 10);
  const cards = parseInt(cardsInput.value, 10);
  const outputDiv = document.getElementById('output');
  const t = translations[currentLang];

  let errors = [];

  if (isNaN(currentLevel)) {
    errors.push(t.errorInvalidLevel);
  } else {
    if (heroType === 'common' && (currentLevel < 1 || currentLevel > 27)) {
      errors.push(t.errorCommonLevelRange);
    } else if (heroType === 'rare' && (currentLevel < 3 || currentLevel > 27)) {
      errors.push(t.errorRareLevelStart);
    } else if (heroType === 'epic' && (currentLevel < 5 || currentLevel > 27)) {
      errors.push(t.errorEpicLevelStart);
    }
  }

  // Stanovenie rezervy na darovanie podľa typu hrdinu (bežný: 500, vzácny: 200, epický: 100)
  let donationReserve = 100;
  if (heroType === 'common') {
    donationReserve = 500;
  } else if (heroType === 'rare') {
    donationReserve = 200;
  } else if (heroType === 'epic') {
    donationReserve = 100;
  }

  let baseStartLevel = (heroType === 'common') ? 1 : (heroType === 'rare' ? 3 : 5);
  let absoluteCardsToMax = 0;
  for (let i = baseStartLevel - 1; i < 26; i++) {
    const requirement = levelData[i][heroType];
    if (typeof requirement === 'number') {
      absoluteCardsToMax += requirement;
    }
  }
  
  const maxAllowedCardsWithDonation = absoluteCardsToMax + donationReserve;

  if (isNaN(cards)) {
    errors.push(t.errorInvalidCards);
  } else if (cards < 0) {
    errors.push(t.errorInvalidCards);
  } else if (cards > maxAllowedCardsWithDonation) {
    errors.push(t.errorMaxCards.replace('{maxCards}', formatGold(maxAllowedCardsWithDonation)));
  }

  if (errors.length > 0) {
    outputDiv.innerHTML = errors.map(err => `<span class="error">${err}</span>`).join("");
    return;
  }

  if (currentLevel === 27) {
    outputDiv.innerHTML = `<span class="error">${t.outputMaxLevelReached}</span>`;
    currentLevelInput.value = "";
    cardsInput.value = "";
    return;
  }

  let totalCardsRequiredToMax = 0;
  for (let i = currentLevel - 1; i < 26; i++) {
    const requirement = levelData[i][heroType];
    if (typeof requirement === 'number') {
      totalCardsRequiredToMax += requirement;
    }
  }

  const maxLimitForCurrentLevel = totalCardsRequiredToMax + donationReserve;

  if (cards > maxLimitForCurrentLevel) {
      errors.push(t.errorCardsExceedMaxPossible.replace('{maxCards}', formatGold(maxLimitForCurrentLevel)));
  }

  if (errors.length > 0) {
    outputDiv.innerHTML = errors.map(err => `<span class="error">${err}</span>`).join("");
    return;
  }

  let totalGoldToMax = 0;
  for (let i = currentLevel - 1; i < 26; i++) {
    const step = levelData[i];
    const req = step[heroType];
    if (req === 'Full') break;
    totalGoldToMax += step.gold;
  }

  let availableCards = cards;
  let finalLevel = currentLevel;
  let goldNeeded = 0;

  while (finalLevel < 27) {
    const index = finalLevel - 1;
    const neededCardsForThisLevelUp = levelData[index][heroType];
    const neededGoldForThisLevelUp = levelData[index].gold;

    if (neededCardsForThisLevelUp === 'Full') break;

    if (availableCards >= neededCardsForThisLevelUp) {
      availableCards -= neededCardsForThisLevelUp;
      goldNeeded += neededGoldForThisLevelUp;
      finalLevel++;
    }
    else {
      break;
    }
  }

  // Ak dosiahol level 27, zostávajúce karty obsahujú aj prebytok, ale max. do výšky špecifickej rezervy na darovanie
  if (finalLevel === 27) {
      availableCards = Math.min(availableCards, donationReserve);
  }

  let cardsToNextLevelText = '';
  if (finalLevel < 27) {
    const cardsRequiredForNextSingleLevelUp = levelData[finalLevel - 1][heroType];
    if (cardsRequiredForNextSingleLevelUp !== 'Full') {
      const cardsNeeded = cardsRequiredForNextSingleLevelUp - availableCards;
      cardsToNextLevelText = cardsNeeded > 0 ? cardsNeeded : 0;
    } else {
      cardsToNextLevelText = t.outputMaxLevelAchievedText;
    }
  } else {
    cardsToNextLevelText = t.outputMaxLevelAchievedText;
  }

  const cardsNeededForLvl27 = Math.max(0, totalCardsRequiredToMax - cards);

  let resultHTML = `
    ${t.outputMaxLevel} ${finalLevel}<br>
    ${t.outputRemainingCards} ${formatGold(availableCards)}<br>
    ${t.outputCardsToNextLvl} ${formatGold(cardsToNextLevelText)}<br>
    ${t.outputCardsToLvl27} ${formatGold(cardsNeededForLvl27)}<br>
    ${t.outputGoldToLevel} ${finalLevel}: ${formatGold(goldNeeded)}
  `;

  if (finalLevel < 27) {
    resultHTML += `<br>${t.outputGoldToMax} ${formatGold(totalGoldToMax)}`;
  }

  outputDiv.innerHTML = resultHTML;

  if (errors.length === 0 && currentLevel !== 27) {
    currentLevelInput.value = "";
    cardsInput.value = "";
  }
}

function updateMetaTags(lang) {
    const t = translations[lang];
    document.getElementById('pageTitle').textContent = t.pageTitle;

    let metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) {
        metaDescription.setAttribute('content', t.metaDescription);
    } else {
        metaDescription = document.createElement('meta');
        metaDescription.name = 'description';
        metaDescription.content = t.metaDescription;
        document.head.appendChild(metaDescription);
    }

    let metaKeywords = document.querySelector('meta[name="keywords"]');
    if (metaKeywords) {
        metaKeywords.setAttribute('content', t.metaKeywords);
    } else {
        metaKeywords = document.createElement('meta');
        metaKeywords.name = 'keywords';
        metaKeywords.content = t.metaKeywords;
        document.head.appendChild(metaKeywords);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    setLanguage('sk');
});

const originalSetLanguage = setLanguage;
setLanguage = function(lang) {
    originalSetLanguage(lang);
    updateMetaTags(lang);
};
</script>
